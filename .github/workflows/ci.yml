name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run tests (lims-web)
        run: mvn -Dspring.cloud.gcp.sql.enabled=false -pl lims-web -am test

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Show Docker info
        run: |
          docker --version || true
          docker buildx version || true

      - name: Log in to GitHub Container Registry
        if: ${{ secrets.GHCR_TOKEN != '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build lims-web Docker image
        run: |
          docker build --file lims-web/Dockerfile --tag ghcr.io/${{ github.repository }}/lims-web:${{ github.sha }} lims-web

      - name: Save image to tar
        run: |
          docker save ghcr.io/${{ github.repository }}/lims-web:${{ github.sha }} -o lims-web-${{ github.sha }}.tar || true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: lims-web-image-${{ github.sha }}
          path: lims-web-${{ github.sha }}.tar

      - name: Push Docker image to GHCR
        if: ${{ secrets.GHCR_TOKEN != '' }}
        run: |
          docker push ghcr.io/${{ github.repository }}/lims-web:${{ github.sha }}
