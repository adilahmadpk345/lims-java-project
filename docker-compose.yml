services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: limsdb
      MYSQL_USER: lims
      MYSQL_PASSWORD: lims
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  lims-web:
    build:
      context: ./lims-web
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/limsdb
      SPRING_DATASOURCE_USERNAME: lims
      SPRING_DATASOURCE_PASSWORD: lims
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_CLOUD_GCP_SQL_ENABLED: "false"
      # Optional: set GEMINI_API_KEY if you want to enable real Gemini in container
      # GEMINI_API_KEY: ${GEMINI_API_KEY:}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
